---
version: 2
updates:
# Set update schedule for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
