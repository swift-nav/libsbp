name: Cancel old jobs
on: pull_request

permissions:
  contents: read

jobs:
  cancel:
    name: auto-cancellation-running-action
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: fauguste/auto-cancellation-running-action@fb5555e5913347f53f2e4fdea18b0166063c6f15 # 0.1.4
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
